<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distâncias dos talhões até a sede</title>
<meta name="description" content="Distância de cada talhão até a sede da fazenda, medida pelas estradas.">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="mapa.css?v=20260915b">
</head><body>
<div id="shell">

  <header class="topo">
    <button id="btSidebar" aria-label="Mostrar lista de talhões">☰</button>
    <h1>Distâncias dos talhões</h1>
    <nav class="navtop">
      <div class="navitem">
        <button class="navbt" id="btExportar" aria-expanded="false">Exportar <span class="seta">▾</span></button>
        <div class="painel" id="painelExportar"></div>
      </div>
      <div class="navitem">
        <button class="navbt" id="btFazendas" aria-expanded="false">Fazendas <span class="seta">▾</span></button>
        <div class="painel" id="painelFazendas"></div>
      </div>
      <div class="navitem">
        <button class="navbt" id="btCamadas" aria-expanded="false">Camadas <span class="seta">▾</span></button>
        <div class="painel" id="painelCamadas"></div>
      </div>
      <button class="navbt" id="btPendencias">Pendências</button>
    </nav>
  </header>

  <div id="app">
    <aside id="sidebar">
      <div id="buscaWrap">
        <input type="search" id="busca" placeholder="Buscar talhão — ex.: T-05, 05B…" autocomplete="off">
      </div>
      <div id="resultados"></div>
      <div id="lista"></div>
      <div id="pendentes">
        <b>Java e Ponte de Pedra entregam a colheita na sede do Tucano</b> — por isso a distância
        de cada talhão dessas duas fazendas é medida até lá, não até a própria sede.
      </div>
    </aside>
    <main id="mapwrap">
      <div id="alertas"><div class="marquee-track" id="marqueeTrack"></div></div>
      <div id="mapa"></div>
      <div id="ficha">
        <button class="fechar" aria-label="Fechar">×</button>
        <h3 id="ft"></h3>
        <p class="faz" id="ff"></p>
        <div class="nums" id="fn"></div>
        <p class="obs" id="fo"></p>
      </div>
    </main>
  </div>

  <div id="modalCampos" class="modal">
    <div class="caixa">
      <h3>Escolher campos para exportar</h3>
      <div id="camposLista"></div>
      <div class="botoes">
        <button class="bt" id="camposCancelar">Cancelar</button>
        <button class="bt p" id="camposExportar">Exportar .csv</button>
      </div>
    </div>
  </div>

  <div id="modalInfo" class="modal">
    <div class="caixa">
      <h3 id="infoTitulo"></h3>
      <div id="infoCorpo"></div>
      <div class="botoes">
        <button class="bt p" id="infoFechar">Fechar</button>
      </div>
    </div>
  </div>
</div>

<script src="leaflet.js"></script>
<script src="dados_mapa.js?v=20260915d"></script>
<script src="app.js?v=20260915e"></script>
</body></html>
