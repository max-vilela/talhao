<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distâncias dos talhões até a sede</title>
<meta name="description" content="Distância de cada talhão até a sede da fazenda, medida pelas estradas.">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="mapa.css">
</head><body>
<div id="shell">

  <header class="topo">
    <button id="btSidebar" aria-label="Mostrar lista de talhões">☰</button>
    <h1>Distâncias dos talhões até a sede</h1>
    <p>Medida pelas estradas e carreadores, não em linha reta. Atualizado em 14/09/2026.</p>
    <button id="btMenu" aria-expanded="false" aria-controls="ribbon">Menu <span class="seta">▾</span></button>
  </header>

  <div id="ribbon" hidden></div>

  <div id="app">
    <aside id="sidebar">
      <div id="buscaWrap">
        <input type="search" id="busca" placeholder="Buscar talhão — ex.: T-05, 05B…" autocomplete="off">
      </div>
      <div id="resultados"></div>
      <div id="lista"></div>
      <div id="pendentes">
        <b>Sem ponto de sede no projeto:</b> Promissão (40 talhões) e Tucano (70 talhões).
        Sem origem marcada no Google Earth não há o que medir — por isso não aparecem no mapa.
      </div>
    </aside>
    <main id="mapwrap">
      <div id="mapa"></div>
      <div id="ficha">
        <button class="fechar" aria-label="Fechar">×</button>
        <h3 id="ft"></h3>
        <p class="faz" id="ff"></p>
        <div class="nums" id="fn"></div>
        <p class="obs" id="fo"></p>
      </div>
    </main>
  </div>
</div>

<script src="leaflet.js"></script>
<script src="dados_mapa.js"></script>
<script src="app.js"></script>
</body></html>
